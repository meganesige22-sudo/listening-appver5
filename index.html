<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語リスニング学習アプリ (バックグラウンド対応)</title>
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Listening Study">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .highlight {
            background-color: #fef08a;
            border-left: 4px solid #eab308;
            padding-left: 0.75rem;
            transition: all 0.2s ease;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-28">

    <!-- ヘッダー -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-20">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold tracking-wide">Listening Study</h1>
            <div class="flex space-x-2">
                <button id="install-guide-btn" class="bg-blue-500 hover:bg-blue-700 text-xs px-2.5 py-1.5 rounded-lg font-medium transition" title="ホーム画面に追加する方法">
                    📱 ホームへ追加
                </button>
                <button id="toggle-input-btn" class="bg-blue-500 hover:bg-blue-700 text-xs px-3 py-1.5 rounded-lg font-medium transition">
                    英文設定
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4 space-y-4">

        <!-- ホーム画面追加の案内モーダル -->
        <div id="install-modal" class="bg-blue-50 border border-blue-200 p-4 rounded-xl text-xs text-blue-900 hidden space-y-2">
            <div class="flex justify-between items-center font-bold">
                <span>💡 ホーム画面への追加方法</span>
                <button id="close-modal-btn" class="text-blue-500 hover:text-blue-700 text-sm font-bold">×</button>
            </div>
            <p>このアプリをいつでもすぐ起動できるように、スマホのホーム画面に常駐させることができます。</p>
            <ul class="list-disc pl-4 space-y-1">
                <li><strong>iPhone (Safari):</strong> 画面下部の共有ボタンをタップ ＞ 「ホーム画面に追加」を選択。</li>
                <li><strong>Android (Chrome):</strong> 画面右上のメニューをタップ ＞ 「ホーム画面に追加」を選択。</li>
            </ul>
        </div>

        <!-- 1. 英文入力エリア -->
        <section id="input-section" class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 hidden">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider">英文テキスト入力</h2>
                <button id="paste-btn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs px-2.5 py-1 rounded-md font-medium transition flex items-center space-x-1">
                    <span>クリップボードから貼付け</span>
                </button>
            </div>
            <div class="space-y-3">
                <textarea id="english-input" rows="5" class="w-full p-3 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="ここに英語のテキストを入力してください。"></textarea>
                <button id="save-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-sm">
                    保存してスクリプトに反映
                </button>
            </div>
        </section>

        <!-- 2. 中央の再生エリアとオプション -->
        <section class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex flex-col items-center justify-center space-y-4">
            <div class="flex flex-col items-center justify-center space-y-2">
                <button id="main-play-pause-btn" class="bg-blue-600 hover:bg-blue-700 text-white p-5 rounded-full shadow-lg transition flex items-center justify-center w-16 h-16 transform active:scale-95 focus:outline-none">
                    <svg id="main-play-icon" class="w-8 h-8 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <svg id="main-pause-icon" class="w-8 h-8 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </button>
                <span class="text-xs text-gray-500 font-medium" id="center-play-label">タップして再生 / 一時停止</span>
            </div>

            <div class="flex items-center justify-center space-x-6 text-xs text-gray-600 pt-2 border-t w-full">
                <label class="flex items-center space-x-1.5 cursor-pointer">
                    <input type="checkbox" id="toggle-eng" checked class="w-4 h-4 text-blue-600 rounded">
                    <span>英文表示</span>
                </label>
                <label class="flex items-center space-x-1.5 cursor-pointer">
                    <input type="checkbox" id="loop-one" class="w-4 h-4 text-blue-600 rounded">
                    <span>1文リピート</span>
                </label>
            </div>
        </section>

        <!-- 3. 字幕表示エリア -->
        <section class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-3 bg-gray-100 border-b text-xs font-semibold text-gray-500 flex justify-between items-center">
                <span>スクリプト（タップで選択）</span>
                <span id="current-position-label">0 / 0</span>
            </div>
            <div id="subtitles-container" class="p-4 space-y-3 max-h-[52vh] overflow-y-auto">
                <div class="text-center text-gray-400 py-8 text-sm">
                    読み込み中...
                </div>
            </div>
        </section>

    </main>

    <!-- 4. 固定コントロール（画面下部） -->
    <footer class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-3 shadow-lg z-30">
        <div class="max-w-xl mx-auto space-y-2">
            <div class="flex items-center space-x-2">
                <input type="range" id="progress-bar" min="0" max="100" value="0" class="w-full accent-blue-600 cursor-pointer">
            </div>

            <div class="flex items-center justify-around">
                <button id="prev-btn" class="p-2 text-gray-600 hover:text-blue-600 transition flex flex-col items-center" title="前の文へ">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/></svg>
                    <span class="text-[10px] text-gray-400">前へ</span>
                </button>

                <button id="stop-btn" class="p-2 text-gray-600 hover:text-red-600 transition flex flex-col items-center" title="停止">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10h6v4H9z"/></svg>
                    <span class="text-[10px] text-gray-400">停止</span>
                </button>

                <button id="next-btn" class="p-2 text-gray-600 hover:text-blue-600 transition flex flex-col items-center" title="次の文へ">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"/></svg>
                    <span class="text-[10px] text-gray-400">次へ</span>
                </button>

                <div class="flex flex-col items-center">
                    <select id="rate-select" class="bg-gray-100 border border-gray-300 rounded-lg text-xs p-1.5 font-medium focus:outline-none">
                        <option value="0.5">0.5x</option>
                        <option value="0.75">0.75x</option>
                        <option value="1" selected>1.0x</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2">2.0x</option>
                    </select>
                    <span class="text-[10px] text-gray-400 mt-0.5">速度</span>
                </div>
            </div>
        </div>
    </footer>

    <!-- バックグラウンド維持用の隠しオーディオ要素 -->
    <audio id="bg-audio" loop playsinline style="display:none;"></audio>

    <script>
        const defaultEnglish = `Hello and welcome to this English listening practice session. 
Regular input is the key to improving your listening skills. 
Try to follow the subtitles as you listen to each sentence. 
You can adjust the playback speed, repeat sentences, and review comfortably. 
Let's make this a daily habit for better fluency!`;

        const englishInput = document.getElementById('english-input');
        const saveBtn = document.getElementById('save-btn');
        const pasteBtn = document.getElementById('paste-btn');
        const inputSection = document.getElementById('input-section');
        const toggleInputBtn = document.getElementById('toggle-input-btn');
        const installGuideBtn = document.getElementById('install-guide-btn');
        const installModal = document.getElementById('install-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const subtitlesContainer = document.getElementById('subtitles-container');
        
        const mainPlayPauseBtn = document.getElementById('main-play-pause-btn');
        const mainPlayIcon = document.getElementById('main-play-icon');
        const mainPauseIcon = document.getElementById('main-pause-icon');
        const centerPlayLabel = document.getElementById('center-play-label');

        const stopBtn = document.getElementById('stop-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const rateSelect = document.getElementById('rate-select');
        const progressBar = document.getElementById('progress-bar');
        const currentPositionLabel = document.getElementById('current-position-label');

        const toggleEng = document.getElementById('toggle-eng');
        const loopOne = document.getElementById('loop-one');
        const bgAudio = document.getElementById('bg-audio');

        let sentences = [];
        let currentIndex = 0;
        let isPlaying = false;
        let currentUtterance = null;
        let silentAudioUrl = "";

        // 無音の短いWAVデータを生成（バックグラウンドでオーディオセッションを維持するため）
        function createSilentAudio() {
            const sampleRate = 8000;
            const numChannels = 1;
            const bitsPerSample = 16;
            const blockAlign = (numChannels * bitsPerSample) / 8;
            const byteRate = sampleRate * blockAlign;
            const dataSize = sampleRate * blockAlign * 1; // 1秒の無音
            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);

            function writeString(view, offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataSize, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitsPerSample, true);
            writeString(view, 36, 'data');
            view.setUint32(40, dataSize, true);

            const blob = new Blob([view], { type: 'audio/wav' });
            silentAudioUrl = URL.createObjectURL(blob);
            bgAudio.src = silentAudioUrl;
        }

        createSilentAudio();

        // 初期化
        englishInput.value = localStorage.getItem('listening_eng') || defaultEnglish;
        parseAndRender();

        installGuideBtn.addEventListener('click', () => { installModal.classList.toggle('hidden'); });
        closeModalBtn.addEventListener('click', () => { installModal.classList.add('hidden'); });
        toggleInputBtn.addEventListener('click', () => {
            inputSection.classList.toggle('hidden');
            installModal.classList.add('hidden');
        });

        pasteBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                if (text) { englishInput.value = text; } 
                else { alert('クリップボードにテキストがありません。'); }
            } catch (err) {
                alert('クリップボードへのアクセスが許可されていないか、サポートされていません。');
            }
        });

        saveBtn.addEventListener('click', () => {
            localStorage.setItem('listening_eng', englishInput.value);
            parseAndRender();
            inputSection.classList.add('hidden');
            stopAudio();
        });

        function parseAndRender() {
            const engText = englishInput.value.trim();
            sentences = engText ? engText.match(/[^.!?\n]+[.!?\n]*/g) || [engText] : [];
            sentences = sentences.map(s => s.trim()).filter(s => s.length > 0);

            subtitlesContainer.innerHTML = '';
            if (sentences.length === 0) {
                subtitlesContainer.innerHTML = '<div class="text-center text-gray-400 py-8 text-sm">英文がありません。</div>';
                currentPositionLabel.textContent = '0 / 0';
                return;
            }

            sentences.forEach((sent, idx) => {
                const div = document.createElement('div');
                div.className = `p-3 rounded-lg border border-gray-100 transition cursor-pointer sentence-item ${idx === 0 ? 'highlight' : ''}`;
                div.dataset.index = idx;

                const engP = document.createElement('p');
                engP.className = `text-base font-medium text-gray-900 eng-text ${toggleEng.checked ? '' : 'hidden'}`;
                engP.textContent = sent;

                div.appendChild(engP);
                div.addEventListener('click', () => {
                    currentIndex = idx;
                    playSentence(currentIndex);
                });
                subtitlesContainer.appendChild(div);
            });

            currentPositionLabel.textContent = `1 / ${sentences.length}`;
            updateProgress();
        }

        toggleEng.addEventListener('change', () => {
            document.querySelectorAll('.eng-text').forEach(el => {
                el.classList.toggle('hidden', !toggleEng.checked);
            });
        });

        // 音声再生の制御（Web Speech APIとバックグラウンド維持用オーディオを連携）
        function playSentence(index) {
            if (index < 0 || index >= sentences.length) {
                stopAudio();
                return;
            }

            window.speechSynthesis.cancel();
            currentIndex = index;
            updateHighlight();

            // iOSなどのバックグラウンド制限を突破するため、無音オーディオを裏で再生状態にする
            bgAudio.play().catch(() => {});

            const textToSpeak = sentences[currentIndex];
            currentUtterance = new SpeechSynthesisUtterance(textToSpeak);
            currentUtterance.lang = 'en-US';
            currentUtterance.rate = parseFloat(rateSelect.value);

            currentUtterance.onend = () => {
                if (!isPlaying) return;
                
                if (loopOne.checked) {
                    playSentence(currentIndex);
                } else if (currentIndex < sentences.length - 1) {
                    playSentence(currentIndex + 1);
                } else {
                    stopAudio();
                }
            };

            currentUtterance.onerror = () => {
                stopAudio();
            };

            window.speechSynthesis.speak(currentUtterance);
            isPlaying = true;
            updatePlayButtonState();
        }

        function updateHighlight() {
            const items = subtitlesContainer.querySelectorAll('.sentence-item');
            items.forEach((item, idx) => {
                if (idx === currentIndex) {
                    item.classList.add('highlight');
                    item.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else {
                    item.classList.remove('highlight');
                }
            });
            currentPositionLabel.textContent = `${currentIndex + 1} / ${sentences.length}`;
            updateProgress();
        }

        function updateProgress() {
            if (sentences.length === 0) {
                progressBar.value = 0;
                return;
            }
            const progress = (currentIndex / (sentences.length - 1)) * 100;
            progressBar.value = isNaN(progress) ? 0 : progress;
        }

        function stopAudio() {
            window.speechSynthesis.cancel();
            bgAudio.pause();
            isPlaying = false;
            updatePlayButtonState();
        }

        function updatePlayButtonState() {
            if (isPlaying) {
                mainPlayIcon.classList.add('hidden');
                mainPauseIcon.classList.remove('hidden');
                centerPlayLabel.textContent = '再生中... (タップで一時停止)';
            } else {
                mainPlayIcon.classList.remove('hidden');
                mainPauseIcon.classList.add('hidden');
                centerPlayLabel.textContent = 'タップして再生 / 一時停止';
            }
        }

        mainPlayPauseBtn.addEventListener('click', () => {
            if (sentences.length === 0) return;

            if (isPlaying) {
                window.speechSynthesis.pause();
                bgAudio.pause();
                isPlaying = false;
                updatePlayButtonState();
            } else {
                if (window.speechSynthesis.paused) {
                    window.speechSynthesis.resume();
                    bgAudio.play().catch(() => {});
                    isPlaying = true;
                    updatePlayButtonState();
                } else {
                    playSentence(currentIndex);
                }
            }
        });

        stopBtn.addEventListener('click', () => {
            stopAudio();
            currentIndex = 0;
            updateHighlight();
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                if (isPlaying) {
                    playSentence(currentIndex);
                } else {
                    updateHighlight();
                }
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < sentences.length - 1) {
                currentIndex++;
                if (isPlaying) {
                    playSentence(currentIndex);
                } else {
                    updateHighlight();
                }
            }
        });

        progressBar.addEventListener('input', (e) => {
            if (sentences.length === 0) return;
            const val = e.target.value;
            const newIndex = Math.round((val / 100) * (sentences.length - 1));
            currentIndex = newIndex;
            if (isPlaying) {
                playSentence(currentIndex);
            } else {
                updateHighlight();
            }
        });
    </script>
</body>
</html>
